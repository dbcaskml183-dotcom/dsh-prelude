name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the published archive against its tagged source
        run: |
          version=$(node -p "require('./package.json').version")
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            git worktree add --detach "$RUNNER_TEMP/released" "v$version"
            cmp "release/dsh-prompt-coach-$version.tgz" "$RUNNER_TEMP/released/release/dsh-prompt-coach-$version.tgz"
            (cd "$RUNNER_TEMP/released" && node tools/manifest.mjs --release)
          else
            node tools/manifest.mjs --release
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run verify
      - run: npm run verify:source -- --tracked
      - run: git diff --exit-code -- client.js index.mjs bin/storage-doctor.mjs MANIFEST.sha256
